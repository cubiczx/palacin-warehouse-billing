name: .NET CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Publish Application
      run: dotnet publish WarehouseBilling/WarehouseBilling.csproj --configuration Release --output ./publish --no-build

    - name: Upload Artifact (CD Ready)
      uses: actions/upload-artifact@v4
      with:
        name: warehouse-billing-artifact
        path: ./publish/
        
    # Opcional: Aquí puedes añadir los pasos de despliegue real a tu servidor, 
    # Docker Hub, AWS ECS, Azure App Service, etc., usando secretos del repositorio.
    # - name: Deploy to Production
    #   run: echo "Desplegando aplicación..."
