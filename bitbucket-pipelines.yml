image: tu-usuario/dotnet10-aws-ci:latest

pipelines:
  default:
    - step:
        name: Build & Unit Tests
        caches:
          - dotnetcore
        script:
          - dotnet restore
          - dotnet build --configuration Release --no-restore
          - dotnet test --configuration Release --no-build --verbosity normal

  branches:
    main:
      - step:
          name: Build, Test & Deploy to AWS ECR
          services:
            - docker
          caches:
            - dotnetcore
          script:
            # 1. Compilar y pasar tests
            - dotnet restore
            - dotnet build --configuration Release --no-restore
            - dotnet test --configuration Release --no-build --verbosity normal

            # 2. Autenticarse en AWS ECR (la imagen personalizada ya incluye la AWS CLI)
            - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

            # 3. Construir y subir la imagen Docker
            - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$AWS_ECR_REPOSITORY_NAME
            - docker build -t $IMAGE_URI:latest .
            - docker push $IMAGE_URI:latest
            - docker tag $IMAGE_URI:latest $IMAGE_URI:$BITBUCKET_COMMIT
            - docker push $IMAGE_URI:$BITBUCKET_COMMIT
